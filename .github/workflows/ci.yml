name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  development-verification:
    name: Dev Verification (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests & Coverage
        run: npm run test:coverage

      - name: Build Package
        run: npm run build

      - name: Smoke Tests (ESM & CJS)
        run: npm run test:smoke

      - name: Pack Tarball
        if: matrix.node-version == '20.x'
        run: npm pack

      - name: Upload Tarball Artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: rahul_dadhich15-developer-utilities-toolkit-*.tgz
          retention-days: 5

  runtime-compatibility:
    name: Consumer Runtime Verification (Tarball)
    needs: development-verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Download Tarball Artifact
        uses: actions/download-artifact@v4
        with:
          name: package-tarball

      - name: Verify Consumer Installation and Subpaths
        run: node scripts/verify-tarball.mjs rahul_dadhich15-developer-utilities-toolkit-*.tgz
